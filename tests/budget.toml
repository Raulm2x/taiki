# (lo usa la CI); en local solo avisa. `baseline_checks` es un TECHO: pasarse
# por arriba avisa, bajar nunca (la poda es válida si la cobertura se mantiene).
[suite]
# P4 (T-0028) añadió integración real (dependencias, orquestador, scheduler,
