# Presupuesto de la suite. El tiempo es un gate duro con `--strict-budget`
# (lo usa la CI); en local solo avisa. `baseline_checks` es un TECHO: pasarse
# por arriba avisa, bajar nunca (la poda es válida si la cobertura se mantiene).
[suite]
# P4 (T-0028) añadió integración real (dependencias, orquestador, scheduler,
# status a escala y smoke CLI). Techo revisado una vez; a partir de aquí, podar.
# P4: integración real (status, atribución, worktree y smoke opt-in).
# P0/P1 (T-0045.01): +2 módulos de memoria (105 comprobaciones) y el esquema v5.
# Revisión única del techo para la fundación de memoria; a partir de aquí, podar.
# P1 (T-0045.02): +2 módulos de contrato de CLI y brief (+46 comprobaciones).
# P2 integración (T-0046.07): 1411 checks reales; consolidación de ramas
# paralelas; podar antes de volver a subir. La suite combinada ronda 7.2-7.5s;
# CI conserva su presupuesto propio de 8.0s.
max_seconds = 7.5
baseline_checks = 1411
# Revisión P4: margen estrecho para que cualquier adición vuelva a avisar.
checks_tolerance = 12

[module]
max_seconds = 0.9

# Perfil de CI: los runners compartidos son más lentos y no deben fallar por
# ruido. Se aplica con CI=true (o TAIKI_CI=true) y cada valor se puede
# sobrescribir con TAIKI_SUITE_BUDGET / TAIKI_MODULE_BUDGET.
[ci.suite]
max_seconds = 8.0

[ci.module]
max_seconds = 1.5
