name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy coverage
          python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tipos
        run: mypy
      - name: Suite
        run: coverage run tests/run.py
      - name: Cobertura
        run: coverage report
      - name: Benchmarks
        run: python -m tests.benchmarks
