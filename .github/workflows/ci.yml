name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy coverage
          python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tipos
        run: mypy
      # Gate duro de tiempo: sin coverage para que el presupuesto no se infle.
      # CI=true aplica el perfil [ci.*] de tests/budget.toml (8 s / 1,5 s).
      - name: Suite (presupuesto estricto)
        run: python tests/run.py --strict-budget
      # La cobertura se mide aparte y no cuenta contra el presupuesto anterior.
      - name: Cobertura por capa
        run: |
          coverage run tests/run.py
          coverage report
          coverage json -o coverage.json
          python tests/coverage_gate.py coverage.json
      # CI=true también relaja los benchmarks (25 ms / 1.500 ms).
      - name: Benchmarks
        run: python -m tests.benchmarks

  # E2E del flujo de ramas en repos temporales, sin red. El job `test` ya aplica
  # el presupuesto completo de la suite (checks y tiempo total); este job activa
  # TAIKI_E2E (el smoke es opt-in porque no cabe en el techo de 5 s de la suite
  # local) y lo ejecuta con el gate estricto de tiempo por módulo.
  e2e:
    runs-on: ubuntu-latest
    env:
      TAIKI_E2E: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: E2E agent → develop → release → main
        run: python tests/run.py --only release --strict-budget
